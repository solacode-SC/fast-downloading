[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastdl-backend"
version = "1.0.0"
description = "Production-grade video downloader API and worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "redis>=5.2.0,<6.0.0",
    "arq>=0.26.1,<1.0.0",
    "httpx>=0.27.2,<1.0.0",
    "aiofiles>=24.1.0,<25.0.0",
    "prometheus-client>=0.21.0,<1.0.0",
    "sentry-sdk[fastapi]>=2.18.0,<3.0.0",
    "yt-dlp[default,curl-cffi]>=2025.1.15",
    "bgutil-ytdlp-pot-provider>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "fakeredis>=2.26.0,<3.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "types-aiofiles>=24.1.0",
    "pip-audit>=2.7.0,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC"]
ignore = [
    "S101",  # assert allowed in tests
    "S104",  # binding 0.0.0.0 in container
    "S108",  # temp dir paths configurable
    "S603",  # subprocess with explicit arg list (never shell=True)
    "B008",  # FastAPI Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
