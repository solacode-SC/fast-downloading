name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg aria2
      - name: Install Python deps
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: backend
        run: ruff check app tests
      - name: Mypy strict typecheck
        working-directory: backend
        run: mypy app
      - name: Pytest (unit + integration)
        working-directory: backend
        run: pytest -v

  frontend:
    name: Frontend Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint & Prettier
        working-directory: frontend
        run: npm run lint
      - name: Vitest unit tests
        working-directory: frontend
        run: npm test
      - name: Next.js production build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Build Production Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend prod image
        run: docker build --target prod -f docker/backend.Dockerfile -t vdl-backend:ci .
      - name: Build frontend prod image
        run: docker build --target prod -f docker/frontend.Dockerfile -t vdl-frontend:ci .
