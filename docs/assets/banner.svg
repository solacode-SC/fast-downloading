  <rect x="782" y="82" width="320" height="190" fill="#B8FF01" stroke="#000000" stroke-width="3"/>

  <!-- Dark Stream Inspector Card -->
  <rect x="772" y="96" width="320" height="190" fill="#000000"/>
  <rect x="766" y="90" width="320" height="190" fill="#12121A" stroke="#000000" stroke-width="3"/>
  <text x="786" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#A1A1AA">STREAM_COPY // 4K60 HDR</text>
  <rect x="1012" y="102" width="56" height="22" fill="#B8FF01"/>
  <text x="1020" y="117" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="900" fill="#000000">READY</text>
  <line x1="786" y1="130" x2="1068" y2="130" stroke="#27272A" stroke-width="2"/>

  <!-- Progress Bar inside Dark Card -->
  <text x="786" y="164" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">2160P AV01 + AAC REMUX</text>
  <rect x="786" y="182" width="282" height="24" fill="#27272A" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="788" y="184" width="235" height="20" fill="#B8FF01"/>
  <text x="786" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="800" fill="#B8FF01">16.4 MB/s  ·  12x FRAGMENTS  ·  ETA 00:01</text>

  <!-- Overlapping Electric Purple Code Card -->
  <rect x="822" y="246" width="346" height="146" fill="#000000"/>
  <rect x="816" y="240" width="346" height="146" fill="#7B61FF" stroke="#000000" stroke-width="3"/>
  <rect x="816" y="240" width="346" height="146" fill="url(#purpleGrid)" stroke="#000000" stroke-width="3"/>
  <text x="836" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="900" fill="#B8FF01">&gt; const fastdl = {</text>
  <text x="852" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#FFFFFF">engine: <tspan fill="#B8FF01">'yt-dlp + curl_cffi'</tspan>,</text>
  <text x="852" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#FFFFFF">remux:  <tspan fill="#B8FF01">'ffmpeg -c copy'</tspan>,</text>
  <text x="852" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#FFFFFF">i18n:   <tspan fill="#B8FF01">'EN · FR · AR (100% RTL)'</tspan>,</text>
  <text x="852" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#FFFFFF">stack:  <tspan fill="#B8FF01">'FastAPI · Next 16 · Redis'</tspan></text>
  <text x="836" y="378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="900" fill="#B8FF01">}</text>
</svg>
