  <rect x="280" y="312" width="210" height="46" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <text x="304" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="900" fill="#000000">QUICK DOWNLOAD ↓</text>

