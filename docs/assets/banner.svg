  <rect x="664" y="314" width="42" height="42" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="675" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="900" fill="#000000">FB</text>

  <!-- Right Hero Panel (Coral Pink) -->
  <rect x="726" y="54" width="468" height="360" fill="#FF7597" stroke="#000000" stroke-width="3"/>

