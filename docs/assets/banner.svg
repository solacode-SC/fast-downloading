  <text x="42" y="182" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="68" font-weight="900" fill="#000000" letter-spacing="-2">FAST VIDEO</text>
  <text x="42" y="250" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="68" font-weight="900" fill="#000000" letter-spacing="-2">DOWNLOADER</text>

