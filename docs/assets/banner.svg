<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#000000" stroke-width="1" stroke-opacity="0.08"/>
    </pattern>
    <pattern id="purpleGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Outer Frame -->
  <rect x="4" y="4" width="1192" height="412" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>

  <!-- Top Bar -->
  <rect x="6" y="6" width="210" height="48" fill="#B8FF01" stroke="#000000" stroke-width="3"/>
  <text x="26" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="900" fill="#000000">&lt;/&gt; FASTDL v1.0</text>

  <rect x="216" y="6" width="770" height="48" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <text x="250" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#000000" letter-spacing="2">YOUTUBE  ·  X / TWITTER  ·  INSTAGRAM  ·  FACEBOOK</text>

  <rect x="986" y="6" width="208" height="48" fill="#7B61FF" stroke="#000000" stroke-width="3"/>
  <text x="1014" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">PUBLIC ONLY →</text>

  <!-- Left Hero Panel (Graph Paper Grid) -->
