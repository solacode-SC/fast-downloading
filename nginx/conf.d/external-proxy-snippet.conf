# Include this server block inside your EXISTING VPS Nginx container when using
# docker-compose.prod.external-net.yml (joined to EXTERNAL_PROXY_NETWORK=proxy_net).
# In this mode, FastDL publishes ZERO host ports; your existing Nginx connects directly
# to container aliases `fastdl-frontend:3000` and `fastdl-api:8000`.

server {
    listen 80;
    server_name dl.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dl.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/dl.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dl.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 128k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ ^/api/v1/jobs/[^/]+/events$ {
        proxy_pass http://fastdl-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 1800s;
    }

    location ^~ /api/v1/files/ {
        proxy_pass http://fastdl-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        gzip off;
        proxy_read_timeout 1800s;
    }

    location ^~ /api/ {
        proxy_pass http://fastdl-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://fastdl-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
