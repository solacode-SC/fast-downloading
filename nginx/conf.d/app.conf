upstream fastdl_frontend {
    server frontend:3000;
    keepalive 32;
}

upstream fastdl_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 128k;

    # Let's Encrypt ACME HTTP-01 challenge path (when enabling TLS)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Healthcheck endpoint for Nginx container itself
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

    # Server-Sent Events (SSE) progress stream: zero buffering, long read timeout
    location ~ ^/api/v1/jobs/[^/]+/events$ {
        proxy_pass http://fastdl_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Streamed file downloads: Range support, zero buffering, gzip off, long timeout
    location ^~ /api/v1/files/ {
        proxy_pass http://fastdl_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        gzip off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Resolve endpoint (rate-limited)
    location = /api/v1/resolve {
        limit_req zone=api_resolve burst=20 nodelay;
        proxy_pass http://fastdl_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Jobs & other API endpoints
    location ^~ /api/ {
        limit_req zone=api_jobs burst=25 nodelay;
        proxy_pass http://fastdl_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://fastdl_api/healthz;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://fastdl_api/readyz;
    }

    # Do NOT expose Prometheus /metrics publicly through Nginx
    location = /metrics {
        return 404;
    }

    # Next.js frontend
    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://fastdl_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

