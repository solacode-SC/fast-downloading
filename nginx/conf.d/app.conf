upstream fastdl_frontend {
    server frontend:3000;
    keepalive 32;
}

upstream fastdl_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt ACME HTTP-01 challenge path (used during cert issuance & renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Healthcheck endpoint for Nginx container itself
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    include /etc/nginx/snippets/fastdl-locations.conf;
}
