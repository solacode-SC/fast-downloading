# Shared FastDL security headers and upstream routing locations.
# Included by both HTTP default server (nginx/conf.d/app.conf) and
# HTTPS domain server (nginx/conf.d/tls.local.conf).

client_max_body_size 128k;

# Dynamic upstream variables so Nginx re-resolves Docker DNS after rolling container updates
set $fastdl_api_upstream "http://api:8000";
set $fastdl_frontend_upstream "http://frontend:3000";

# Security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://watcher.solaymanbuilds.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://watcher.solaymanbuilds.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

# Server-Sent Events (SSE) progress stream: zero buffering, long read timeout
location ~ ^/api/v1/jobs/[^/]+/events$ {
    proxy_pass $fastdl_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    gzip off;
    chunked_transfer_encoding on;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}

# Streamed file downloads: Range support, zero buffering, gzip off, long timeout
location ^~ /api/v1/files/ {
    proxy_pass $fastdl_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    gzip off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}

# Resolve endpoint (rate-limited)
location = /api/v1/resolve {
    limit_req zone=api_resolve burst=20 nodelay;
    proxy_pass $fastdl_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
}

# Jobs & other API endpoints
location ^~ /api/ {
    limit_req zone=api_jobs burst=25 nodelay;
    proxy_pass $fastdl_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location = /healthz {
    proxy_pass $fastdl_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    access_log off;
}

location = /readyz {
    proxy_pass $fastdl_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

# Do NOT expose Prometheus /metrics publicly through Nginx
location = /metrics {
    return 404;
}

# Next.js frontend
location / {
    limit_req zone=general burst=60 nodelay;
    proxy_pass $fastdl_frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
