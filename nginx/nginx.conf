worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Non-root writable temp paths (supports read_only container rootfs)
    client_body_temp_path /tmp/nginx_client_temp;
    proxy_temp_path       /tmp/nginx_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_scgi_temp;

    log_format json_combined escape=json
      '{"ts":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"method":"$request_method",'
      '"uri":"$uri",'
      '"status":$status,'
      '"bytes_sent":$bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_time":"$upstream_response_time"}';

    access_log /dev/stdout json_combined;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip for text/JSON/CSS/JS only (never compress video/audio streams)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/manifest+json;

    # Rate-limiting zones per client IP
    limit_req_zone $binary_remote_addr zone=api_resolve:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_jobs:10m rate=15r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/app.conf;
    include /etc/nginx/conf.d/*.local.conf;
}
