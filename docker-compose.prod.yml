name: vdl-prod

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

x-security: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - vdl_prod_redis:/data
    read_only: true
    tmpfs:
      - /tmp:size=64M
    <<: [*hardened]
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks:
      - vdl_internal

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    environment:
      - HOME=/tmp
    tmpfs:
      - /tmp:size=128M,mode=1777
    <<: [*hardened]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 25s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - vdl_internal

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: prod
    image: vdl-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 35s
    env_file:
      - .env.prod
    read_only: true
    volumes:
      - vdl_prod_downloads:/var/lib/vdl/downloads
      - vdl_prod_ytdlp_overlay:/var/lib/vdl/ytdlp-overlay
      - ./secrets/cookies:/run/secrets/cookies:ro
    tmpfs:
      - /tmp:size=256M,mode=1777
      - /tmp/vdl:size=512M,mode=1777
    <<: [*hardened]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1G
    depends_on:
      redis:
        condition: service_healthy
      pot-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      vdl_internal:
        aliases:
          - api
          - fastdl-api

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: prod
    image: vdl-backend:${IMAGE_TAG:-latest}
    command: ["arq", "app.workers.worker.WorkerSettings"]
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - .env.prod
    read_only: true
    volumes:
      - vdl_prod_downloads:/var/lib/vdl/downloads
      - vdl_prod_ytdlp_overlay:/var/lib/vdl/ytdlp-overlay
      - ./secrets/cookies:/run/secrets/cookies:ro
    tmpfs:
      - /tmp:size=512M,mode=1777
      - /tmp/vdl:size=2G,mode=1777
    <<: [*hardened]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
    depends_on:
      redis:
        condition: service_healthy
      pot-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import redis; r=redis.from_url(\"redis://redis:6379/0\"); assert r.ping()'"]
      interval: 25s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      - vdl_internal

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: prod
    image: vdl-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.prod
    read_only: true
    tmpfs:
      - /tmp:size=128M
    <<: [*hardened]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      vdl_internal:
        aliases:
          - frontend
          - fastdl-frontend

  nginx:
    image: nginx:1.27.3-alpine
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /var/cache/nginx:size=64M,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks:
      - vdl_internal

  # ------------------------------------------------------------------
  # Optional Profile: Cloudflare WARP SOCKS5 egress sidecar (L5)
  # Enable with: docker compose -f docker-compose.prod.yml --profile warp up -d
  # and set PROXY_URLS=socks5h://warp:1080 in .env.prod
  # ------------------------------------------------------------------
  warp:
    image: caomingjun/warp:latest
    profiles: ["warp"]
    restart: unless-stopped
    environment:
      - WARP_SLEEP=2
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - vdl_prod_warp:/var/lib/cloudflare-warp
    logging: *default-logging
    networks:
      - vdl_internal

  # ------------------------------------------------------------------
  # Optional Profile: Generic Egress Proxy Relay (L5)
  # Enable with: --profile proxy (forward to your residential/ISP upstream)
  # ------------------------------------------------------------------
  proxy:
    image: vimagick/tinyproxy:latest
    profiles: ["proxy"]
    restart: unless-stopped
    logging: *default-logging
    networks:
      - vdl_internal

  # ------------------------------------------------------------------
  # Optional Profile: Minimal Observability (Prometheus + Grafana) (L8)
  # Enable with: --profile monitoring
  # ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    read_only: true
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - vdl_prod_prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=14d"
    ports:
      - "127.0.0.1:9090:9090"
    <<: [*hardened]
    logging: *default-logging
    networks:
      - vdl_internal

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-change_me_in_prod}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - vdl_prod_grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    <<: [*hardened]
    logging: *default-logging
    networks:
      - vdl_internal

volumes:
  vdl_prod_redis:
  vdl_prod_downloads:
  vdl_prod_ytdlp_overlay:
  vdl_prod_warp:
  vdl_prod_prometheus:
  vdl_prod_grafana:

networks:
  vdl_internal:
    driver: bridge
